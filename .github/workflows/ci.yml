name: PR Checks

on:
  pull_request:
    branches: [dev, production]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:run
      - run: npm run lint
      - run: npm run build
      - run: bash scripts/test-deploy-release.sh
      - run: bash scripts/test-verify-deployment.sh
      - run: bash scripts/test-rollback-release.sh
      - run: node scripts/test-staging-config.mjs
      - run: node scripts/test-ci-config.mjs

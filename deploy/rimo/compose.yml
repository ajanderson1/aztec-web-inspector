name: aztec-web-inspector-staging
services:
  site:
    image: docker.io/library/caddy@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    restart: unless-stopped
    read_only: true
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${RELEASES_ROOT:?Set RELEASES_ROOT}:/srv/releases:ro
    # Separate tailnet and host-local probes; never bind a public/LAN address.
    ports:
      - "${TAILSCALE_IP:?Set Rimo Tailscale IP}:18081:8080"
      - "127.0.0.1:18081:8080"
